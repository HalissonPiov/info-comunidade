<section class="cards-container">

  @for (item of publications$ | async; track $index) {
  <app-card-component [showOptions]="true" [publicacao]="item"
    (updated)="this.realoadPublications$.next()"
    (deleted)="this.realoadPublications$.next()">
  </app-card-component>
  }
</section>

<button class="small-btn secondary" (click)="openCreatePublicacaoDialog()">
  <span class="fab-icon">+</span>
  <span class="fab-text">Criar publicação</span>
</button>
