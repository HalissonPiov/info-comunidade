<div class="filters-container">
  <h2>Filtros</h2>
  <form [formGroup]="publicacaoForm" >

    <div class="search-container">
      <input
        type="text"
        placeholder="Procurar..."
        formControlName="titulo"
      />
    </div>

    <div class="filters-row">
      <input
        type="text"
        placeholder="Hashtag"
        formControlName="hashtags"
      />

      <select formControlName="bairro">
        <option value="">Bairro</option>
        @for (bairro of BAIRROS_UNICOS; track $index) {
          <option [value]="bairro">{{bairro | titlecase}}</option>
        }
      </select>

      <input
        type="date"
        formControlName="dataCriacao"
      />

      <button class="new-post-btn" type="button" (click)="createPublication()">
        + Nova Publicação
      </button>

    </div>

  </form>
</div>
